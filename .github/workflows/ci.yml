name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff pytest numpy
          [ -f requirements.txt ] && python -m pip install -r requirements.txt || true
          [ -f pyproject.toml ] && python -m pip install -e . || true

      - name: Compile check
        run: python -m compileall -q . || true

      - name: Lint
        run: |
          if [ -f pyproject.toml ] || [ -f ruff.toml ] || [ -f .ruff.toml ]; then
            python -m ruff check .
          else
            python -m ruff check --select E9,F63,F7,F82 --ignore E501 .
          fi

      - name: Tests
        run: |
          if [ -d tests ] || [ -d test ]; then
            python -m pytest -q --no-header
          else
            echo "no test directory; compile+lint gate only"
          fi
